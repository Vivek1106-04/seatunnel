# Throwaway diagnostic for the tail spikes in the apache/seatunnel#12165 scheduling benchmark.
# Lives only on fork branch bench-diag-12165. Rebuilds exactly the two commits of apache run
# 39773699199 with a per-stage trigger tracer and runs them in the same order on one runner.
name: Bench diag 12165

on:
  workflow_dispatch:
    inputs:
      jmh:
        description: 'JMH args'
        required: false
        default: '-p pipelineNum=10,100 -f 1 -wi 3 -i 5'
      extra:
        description: 'Extra JVM args'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  diag:
    name: java${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17' ]
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - uses: actions/checkout@v4
        with:
          repository: apache/seatunnel
          ref: 4dcfa28ccc85837edf8ca08e459ae56ddc1b34fd
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: apache/seatunnel
          ref: 771fce22127f51c0419f0633e8c95419a4b2493a
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Apply tracer and build
        run: |
          for arm in baseline candidate; do
            git -C $arm apply ../driver/.github/diag/$arm.patch
            git -C $arm diff --stat
            (cd $arm && ./mvnw -B -q -Pbenchmark -pl seatunnel-benchmarks -am -DskipTests -Dskip.spotless=true package)
          done
      - name: Run
        run: |
          out=${PWD}/out; mkdir -p $out
          { uname -a; lscpu; nproc; free -h; java -version 2>&1; cat /proc/sys/kernel/sched_schedstats 2>&1;
            echo "cpuidle driver: $(cat /sys/devices/system/cpu/cpuidle/current_driver 2>&1) governor: $(cat /sys/devices/system/cpu/cpuidle/current_governor_ro /sys/devices/system/cpu/cpuidle/current_governor 2>/dev/null)";
            grep -H . /sys/devices/system/cpu/cpu0/cpuidle/state*/{name,latency,usage} 2>&1;
            cat /sys/devices/system/clocksource/clocksource0/current_clocksource; } > $out/environment.txt
          cat $out/environment.txt | tail -20
          run() {
            arm=$1; label=$2; d=$out/$label; mkdir -p $d/trace
            echo "== $label start $(date -u +%T)"
            (vmstat -n -t 1 > $d/vmstat.txt) & vm=$!
            pin=$3; pl=""
            if [ "$pin" = qos ]; then sudo python3 driver/.github/diag/qos.py > $d/qos.txt 2>&1 & pl=$!; sleep 1; cat $d/qos.txt; fi
            if [ "$pin" = idlespin ]; then for c in 0 1 2 3; do taskset -c $c chrt -i 0 bash -c 'while :; do :; done' & done; pl=1; sleep 1; ps -eo pid,cls,psr,comm | grep -E ' IDL ' | head; fi
            grep -H . /sys/devices/system/cpu/cpu*/cpuidle/state*/usage > $d/idle-before.txt 2>/dev/null || true
            (cd $arm && java -jar seatunnel-benchmarks/target/benchmarks.jar CheckpointSchedulingBenchmark \
               ${{ inputs.jmh }} \
               -jvmArgsAppend "-Ddiag.trace.dir=$d/trace -Xlog:safepoint*=info,gc*=info:file=$d/trace/jvm-%p.log:timenanos,uptimenanos,tid ${{ inputs.extra }}" \
               -foe true -rf json -rff $d/result.json > $d/jmh.log 2>&1) || echo "jmh exit $?"
            kill $vm || true
            grep -H . /sys/devices/system/cpu/cpu*/cpuidle/state*/usage > $d/idle-after.txt 2>/dev/null || true
            [ -n "$pl" ] && { sudo pkill -f qos.py; pkill -f 'while :; do :; done'; } || true
            grep -E '^Iteration|periodicTriggerDelay|Exception' $d/jmh.log | head -80 || true
          }
          run baseline baseline-free
          run candidate candidate-free
          run candidate candidate-qos qos
          run baseline baseline-qos qos
          run candidate candidate-idlespin idlespin
          run baseline baseline-idlespin idlespin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-java${{ matrix.java }}
          path: out/**
