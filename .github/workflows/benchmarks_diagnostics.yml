# Throwaway diagnostic workflow for the CheckpointSchedulingBenchmark warmup question on
# apache/seatunnel#12418. Lives only on the fork branch bench-diag-12418; never proposed upstream.
# It replaces benchmarks_diagnostics.yml on that branch so the fork's already registered
# workflow can be dispatched with --ref bench-diag-12418.
name: Bench diag 12418

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Candidate fix: lower JIT thresholds so the trigger path compiles within warmup.
          - { name: cts01-j17-p1, java: '17', comp: true, extra: '-XX:CompileThresholdScaling=0.01', jmh: '-p pipelineNum=1 -f 1 -wi 0 -i 20' }
          - { name: cts01-j17-p10, java: '17', comp: true, extra: '-XX:CompileThresholdScaling=0.01', jmh: '-p pipelineNum=10 -f 1 -wi 0 -i 20' }
          - { name: cts05-j17-p1, java: '17', comp: true, extra: '-XX:CompileThresholdScaling=0.05', jmh: '-p pipelineNum=1 -f 1 -wi 0 -i 20' }
          - { name: cts05-j17-p10, java: '17', comp: true, extra: '-XX:CompileThresholdScaling=0.05', jmh: '-p pipelineNum=10 -f 1 -wi 0 -i 20' }
          - { name: cts01-j11-p1, java: '11', comp: true, extra: '-XX:CompileThresholdScaling=0.01', jmh: '-p pipelineNum=1 -f 1 -wi 0 -i 20' }
          # Full sweep with CI settings and the flag: trend, P-axis order and fork offsets.
          - { name: cts01-j17-sweep, java: '17', comp: false, extra: '-XX:CompileThresholdScaling=0.01', jmh: '-f 3 -wi 3 -i 5' }
          - { name: cts01-j11-sweep, java: '11', comp: false, extra: '-XX:CompileThresholdScaling=0.01', jmh: '-f 3 -wi 3 -i 5' }
    env:
      BASE_JVM_ARGS: >-
        -Xms4g -Xmx4g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:+DisableExplicitGC
        -XX:ActiveProcessorCount=4 -Djava.net.preferIPv4Stack=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build benchmark module
        run: ./mvnw -B -q -Pbenchmark -pl seatunnel-benchmarks -am -DskipTests -Dskip.spotless=true package
      - name: Environment
        run: |
          mkdir -p out
          { git rev-parse HEAD; uname -a; lscpu; nproc; free -h; java -version 2>&1; } | tee out/environment.txt
      - name: Run benchmark
        run: |
          mkdir -p out/trace
          args="${BASE_JVM_ARGS} -Ddiag.trace.dir=${PWD}/out/trace ${{ matrix.extra }}"
          if [[ "${{ matrix.comp }}" == "true" ]]; then args="${args} -XX:+PrintCompilation"; fi
          echo "command: java -jar seatunnel-benchmarks/target/benchmarks.jar CheckpointSchedulingBenchmark ${{ matrix.jmh }} -jvmArgsAppend '${args}' -foe true -rf json -rff out/result.json" | tee out/command.txt
          java -jar seatunnel-benchmarks/target/benchmarks.jar CheckpointSchedulingBenchmark \
            ${{ matrix.jmh }} -jvmArgsAppend "${args}" \
            -foe true -rf json -rff out/result.json 2>&1 | tee out/full.log \
            | grep -vE '^\s+[0-9]+\s+[0-9]+ ' || true
          # Compilation events of the trigger path, with the JVM uptime in ms in the first column.
          grep -E 'checkpoint\.CheckpointCoordinator|ScheduledThreadPoolExecutor|SharedCheckpointScheduler|CheckpointSchedulingFixture' \
            out/full.log > out/compilation-trigger-path.txt || true
          gzip out/full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: out/**
