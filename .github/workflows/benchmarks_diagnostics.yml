# Throwaway verification workflow for apache/seatunnel#12418, fork branch bench-verify-12418 only.
# It replaces benchmarks_diagnostics.yml on that branch so the fork's registered workflow can be
# dispatched with --ref bench-verify-12418. Each job runs dev and the fix on the same runner with
# the exact JMH command of tools/benchmarks/run_benchmarks.sh.
name: Bench verify 12418

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: j11-dev-then-fix, java: '11', order: 'dev fix' }
          - { name: j11-fix-then-dev, java: '11', order: 'fix dev' }
          - { name: j17-dev-then-fix, java: '17', order: 'dev fix' }
          - { name: j17-fix-then-dev, java: '17', order: 'fix dev' }
    steps:
      - uses: actions/checkout@v4
        with:
          path: fix
      - uses: actions/checkout@v4
        with:
          repository: apache/seatunnel
          ref: b3898b62d79db47d4b213c830da8745edd8fc678
          path: dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: fix/pom.xml
      - name: Build dev and fix
        run: |
          for side in dev fix; do
            (cd "${side}" && ./mvnw -B -q -Pbenchmark -pl seatunnel-benchmarks -am -DskipTests -Dskip.spotless=true package)
          done
      - name: Environment
        run: |
          mkdir -p out
          { echo "dev=$(git -C dev rev-parse HEAD)"; echo "fix=$(git -C fix rev-parse HEAD)"; uname -a; lscpu; nproc; free -h; java -version 2>&1; } | tee out/environment.txt
      - name: Run sweeps
        run: |
          for side in ${{ matrix.order }}; do
            cmd="java -jar seatunnel-benchmarks/target/benchmarks.jar CheckpointSchedulingBenchmark -f 3 -wi 3 -i 5 -foe true -rf json -rff ${PWD}/out/${side}.json"
            echo "${side}: ${cmd}" | tee -a out/command.txt
            (cd "${side}" && ${cmd}) > "out/${side}.log" 2>&1 || echo "${side} FAILED" | tee -a out/command.txt
            grep -E "^# (Parameters|Fork)|^(# Warmup )?Iteration|# measured|# checkpoint scheduler|above the|Exception" "out/${side}.log" | head -400 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: out/**
