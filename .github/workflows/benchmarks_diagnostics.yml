# Throwaway diagnostic workflow for the CheckpointSchedulingBenchmark warmup question on
# apache/seatunnel#12418. Lives only on the fork branch bench-diag-12418; never proposed upstream.
# It replaces benchmarks_diagnostics.yml on that branch so the fork's already registered
# workflow can be dispatched with --ref bench-diag-12418.
name: Bench diag 12418

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # With the warm-up fix: no JMH warmup at all, to show the score is flat from the start.
          - { name: fix-j11-p1-trajectory, java: '11', dev: false, comp: true, jmh: '-p pipelineNum=1 -f 1 -wi 0 -i 15' }
          - { name: fix-j11-p10-trajectory, java: '11', dev: false, comp: true, jmh: '-p pipelineNum=10 -f 1 -wi 0 -i 15' }
          - { name: fix-j17-p1-trajectory, java: '17', dev: false, comp: true, jmh: '-p pipelineNum=1 -f 1 -wi 0 -i 15' }
          - { name: fix-j17-p10-trajectory, java: '17', dev: false, comp: true, jmh: '-p pipelineNum=10 -f 1 -wi 0 -i 15' }
          # Full sweep with the settings of tools/benchmarks/run_benchmarks.sh, before and after.
          - { name: dev-j11-sweep, java: '11', dev: true, comp: false, jmh: '-f 3 -wi 3 -i 5' }
          - { name: dev-j17-sweep, java: '17', dev: true, comp: false, jmh: '-f 3 -wi 3 -i 5' }
          - { name: fix-j11-sweep, java: '11', dev: false, comp: false, jmh: '-f 3 -wi 3 -i 5' }
          - { name: fix-j17-sweep, java: '17', dev: false, comp: false, jmh: '-f 3 -wi 3 -i 5' }
    env:
      # The benchmark's own fork options plus the compilation log; only used when comp is true.
      FORK_JVM_ARGS: >-
        -Xms4g -Xmx4g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:+DisableExplicitGC
        -XX:ActiveProcessorCount=4 -Djava.net.preferIPv4Stack=true -XX:+PrintCompilation
    steps:
      - uses: actions/checkout@v4
        if: ${{ !matrix.dev }}
      - uses: actions/checkout@v4
        if: ${{ matrix.dev }}
        with:
          repository: apache/seatunnel
          ref: b3898b62d79db47d4b213c830da8745edd8fc678
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build benchmark module
        run: ./mvnw -B -q -Pbenchmark -pl seatunnel-benchmarks -am -DskipTests -Dskip.spotless=true package
      - name: Environment
        run: |
          mkdir -p out
          { git rev-parse HEAD; uname -a; lscpu; nproc; free -h; java -version 2>&1; } | tee out/environment.txt
      - name: Run benchmark
        run: |
          extra=()
          if [[ "${{ matrix.comp }}" == "true" ]]; then extra=(-jvmArgsAppend "${FORK_JVM_ARGS}"); fi
          echo "command: java -jar seatunnel-benchmarks/target/benchmarks.jar CheckpointSchedulingBenchmark ${{ matrix.jmh }} ${extra[*]} -foe true -rf json -rff out/result.json" | tee out/command.txt
          java -jar seatunnel-benchmarks/target/benchmarks.jar CheckpointSchedulingBenchmark \
            ${{ matrix.jmh }} "${extra[@]}" \
            -foe true -rf json -rff out/result.json 2>&1 | tee out/full.log \
            | grep -vE '^\s+[0-9]+\s+[0-9]+ ' || true
          # Compilation events of the trigger path, with the JVM uptime in ms in the first column.
          grep -E 'checkpoint\.CheckpointCoordinator|ScheduledThreadPoolExecutor|SharedCheckpointScheduler|CheckpointSchedulingFixture' \
            out/full.log > out/compilation-trigger-path.txt || true
          gzip out/full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: out/**
